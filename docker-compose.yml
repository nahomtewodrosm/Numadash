services:
  mongo:
    image: mongo:7
    container_name: numa-run-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - numa-run-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  numa-run-mongo:
